name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv 9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install frozen development environment
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Run offline tests
        run: uv run pytest -q -m "not live"

      - name: Check whitespace errors
        run: git diff --check

      - name: Reject tracked private manuscript and submission files
        shell: bash
        run: |
          forbidden_tracked="$({
            git ls-files -- \
              'paper/**' \
              'Formatting_Instructions_For_NeurIPS_2026 (2)/**' \
              'artifacts/submission/**'
          })"
          if [[ -n "$forbidden_tracked" ]]; then
            echo "Private manuscript/template/submission files must remain untracked:"
            echo "$forbidden_tracked"
            exit 1
          fi
