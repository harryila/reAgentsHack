[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "literature-multiverse"
version = "0.1.0"
description = "A provenance-first literature disagreement analysis pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.120,<0.121",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "jsonschema>=4.23,<5",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pyarrow>=24,<25",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "streamlit>=1.38,<2",
  "tenacity>=9,<10",
  "uvicorn>=0.52.3",
]

[project.scripts]
lm = "literature_multiverse.cli:main"

[project.optional-dependencies]
gepa = [
  "gepa>=0.1.4,<0.2",
  "litellm>=1.83,<1.92",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/literature_multiverse"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: requires explicit network/provider access and is excluded from default CI",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
